[package]
name = "syncor-cli"
version = "0.1.1"
edition = "2021"
description = "Cross-machine directory sync tool — link, push, pull, resolve conflicts"
license = "MIT"
repository = "https://github.com/syi0808/syncor"
keywords = ["sync", "cli", "git", "backup"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "syncor"
path = "src/main.rs"

[dependencies]
syncor-core = { workspace = true }
clap = { workspace = true }
dialoguer = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
chkpt-core = { workspace = true }
libc = { workspace = true }
