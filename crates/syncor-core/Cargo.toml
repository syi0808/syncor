[package]
name = "syncor-core"
version = "0.1.3"
edition = "2021"
description = "Core library for syncor — cross-machine directory sync via content-addressed storage"
license = "MIT"
repository = "https://github.com/syi0808/syncor"
keywords = ["sync", "backup", "git", "content-addressable"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
chkpt-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
rusqlite = { workspace = true }
notify = { workspace = true }
fs4 = { workspace = true }
lz4_flex = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dirs = { workspace = true }
tracing = { workspace = true }
tempfile = { workspace = true }
libc = { workspace = true }
regex = { workspace = true }
once_cell = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
git2 = { workspace = true }
